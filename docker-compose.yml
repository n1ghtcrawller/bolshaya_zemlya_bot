services:
  postgres:
    image: postgres:16-alpine
    container_name: bz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bolshaya_zemlya}
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot} -d ${POSTGRES_DB:-bolshaya_zemlya}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bz_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Если REDIS_PASSWORD задан — включаем --requirepass, иначе стартуем без auth.
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
    healthcheck:
      test:
        - CMD-SHELL
        - >
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping;
          else
            redis-cli ping;
          fi
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    container_name: bz_bot
    restart: unless-stopped
    env_file:
      - .env
    # Внутри docker-сети hostname-ами выступают имена сервисов.
    # Эти значения перекрывают POSTGRES_HOST / REDIS_HOST из .env, в котором стоит localhost
    # (чтобы локальный запуск `python -m bot` тоже продолжал работать).
    # N8N_BASE_URL указывает на n8n, развёрнутый ОТДЕЛЬНО на хост-машине
    # (через host.docker.internal). Если n8n перенесёте в нашу docker-сеть —
    # поменяйте значение на http://n8n:5678.
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      N8N_BASE_URL: http://host.docker.internal:5678
    # Для Linux: host.docker.internal не резолвится без явного маппинга.
    # На Mac/Windows строчка ниже игнорируется (там host.docker.internal уже работает).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
