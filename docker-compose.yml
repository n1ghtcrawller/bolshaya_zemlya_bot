services:
  postgres:
    image: postgres:16-alpine
    container_name: bz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bolshaya_zemlya}
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot} -d ${POSTGRES_DB:-bolshaya_zemlya}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bz_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Если REDIS_PASSWORD задан — включаем --requirepass, иначе стартуем без auth.
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
    healthcheck:
      test:
        - CMD-SHELL
        - >
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping;
          else
            redis-cli ping;
          fi
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    container_name: bz_bot
    restart: unless-stopped
    env_file:
      - .env
    # POSTGRES_HOST / REDIS_HOST перекрывают значения из .env (там localhost
    # — для локального запуска `python -m bot` без Docker).
    # N8N_BASE_URL = http://n8n:5678 — n8n достижим по DNS-alias `n8n`
    # в общей внешней сети (см. networks ниже). Альтернатива — публичный
    # URL n8n (например, https://bz.n8n.mar-analytics.ru).
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      N8N_BASE_URL: http://n8n:5678
    networks:
      - default
      - n8n_external
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  default:
    name: bz_default
  # Сеть n8n, поднятого отдельным compose-проектом (n8n-compose-file).
  # Бот подключается сюда, чтобы стучаться в n8n по DNS-имени `n8n`,
  # не выходя на хост и не упираясь в loopback-only биндинг порта.
  n8n_external:
    external: true
    name: n8n-compose-file_default
